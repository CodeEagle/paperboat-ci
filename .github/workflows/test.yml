name: PaperBoat CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS + macOS + Shared
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Decrypt source
        env:
          SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
        run: ./ci/decrypt-source.sh

      - name: Install build tools
        run: |
          brew update >/dev/null
          brew install xcodegen swiftformat xcbeautify

      - name: Generate Xcode project
        working-directory: src
        run: xcodegen generate

      - name: SwiftFormat lint check
        working-directory: src
        run: |
          swiftformat --lint . || echo "::warning::SwiftFormat issues found"

      - name: Build iOS (Debug)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            -project PaperBoat.xcodeproj \
            -scheme PaperBoat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run PaperBoatiOSTests
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild test \
            -project PaperBoat.xcodeproj \
            -scheme PaperBoat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:PaperBoatiOSTests \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run PaperBoatUITests (capture screenshots)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild test \
            -project PaperBoat.xcodeproj \
            -scheme PaperBoat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:PaperBoatUITests \
            -derivedDataPath build/ios \
            -resultBundlePath build/uitests.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Extract screenshots from xcresult
        if: always()
        working-directory: src
        run: |
          set -euo pipefail
          BUNDLE=build/uitests.xcresult
          OUT=build/ui-screenshots
          mkdir -p "$OUT"
          if [[ ! -d "$BUNDLE" ]]; then
            echo "::warning::No xcresult bundle at $BUNDLE; skipping extraction"
            exit 0
          fi
          # Xcode 16+ ships `xcresulttool export attachments` which dumps every
          # XCTAttachment into the output dir — no JSON walking required.
          xcrun xcresulttool export attachments \
            --path "$BUNDLE" \
            --output-path "$OUT"
          echo "--- extracted files:"
          find "$OUT" -type f | head -50
          echo "--- total: $(find "$OUT" -type f | wc -l) file(s)"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: src/build/ui-screenshots/
          if-no-files-found: warn

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitests-xcresult
          path: src/build/uitests.xcresult
          if-no-files-found: warn

      - name: Build macOS (Debug)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            -project PaperBoat.xcodeproj \
            -scheme PaperBoat \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build/macos \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Cleanup decrypted source
        if: always()
        run: rm -rf src
