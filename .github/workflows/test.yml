name: PaperBoat CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS + macOS + Shared
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Project / Localize-Swift fork require swift-tools 6.2 (Xcode 26).
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 26 found on runner. Installed:"
            ls /Applications | grep -Ei '^xcode' || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Decrypt source
        env:
          SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
        run: ./ci/decrypt-source.sh

      - name: Install build tools
        run: |
          brew update >/dev/null
          brew install xcodegen swiftformat xcbeautify

      - name: Generate Xcode project
        working-directory: src
        run: xcodegen generate

      - name: SwiftFormat lint check
        working-directory: src
        run: |
          swiftformat --lint . || echo "::warning::SwiftFormat issues found"

      - name: Build iOS (Debug)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            -project PaperBoat.xcodeproj \
            -scheme PaperBoat \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run PaperBoatiOSTests
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild test \
            -project PaperBoat.xcodeproj \
            -scheme PaperBoat \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:PaperBoatiOSTests \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build macOS (Debug)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            -project PaperBoat.xcodeproj \
            -scheme PaperBoat \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build/macos \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Cleanup decrypted source
        if: always()
        run: rm -rf src
